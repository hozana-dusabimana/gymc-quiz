name: CI

# PRs only. The push-to-main path is gated by deploy.yml on the self-hosted
# runner, because this account's GitHub-hosted minutes are metered.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gymc_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gymc_test
      JWT_SECRET: ci-test-secret-please-override
      OPENROUTER_API_KEY: ''
      STORAGE_DRIVER: local
      EMBEDDINGS_FALLBACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run migrate
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api-gymc.isiri.rw/api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gymc
      JWT_SECRET: ci-e2e-secret
      BACKEND_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: google/gemini-3.5-flash-lite
      STORAGE_DRIVER: local
      EMBEDDINGS_FALLBACK: 'true'
      DISABLE_RATE_LIMIT: 'true'
      OTP_DEBUG_LOG: 'true'
      VITE_API_BASE_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Migrate DB
        run: npm run migrate
        working-directory: backend
      - name: Start backend
        run: |
          node src/index.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && break || sleep 1; done
        working-directory: backend
      - name: Start frontend
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break || sleep 1; done
        working-directory: frontend
      - name: Run Playwright
        run: npx playwright test
        working-directory: frontend
      - name: Backend logs
        if: always()
        run: cat /tmp/backend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/e2e/screenshots
          retention-days: 7
